  </Directory>
  <Files xmlrpc.php>
    Require all denied
  </Files>
  # Old /bitnami/wordpress/ URLs keep working
  RewriteEngine On
  RewriteRule ^/bitnami/wordpress(/.*)$ $1 [L,R=301]
  # AI crawlers on GTranslate-translated URLs (2026-11-05): each /fi/, /de/... request makes GTranslate fetch the
  # English original from this server too (double cost). PerplexityBot alone sent ~85/min. English pages stay open
  # to them (AEO); only the machine-translated copies get 429 + Retry-After.
  RewriteCond %{HTTP_USER_AGENT} (PerplexityBot|GPTBot|ClaudeBot|Claude-SearchBot|Amazonbot|Bytespider|meta-externalagent|OAI-SearchBot|CCBot|Applebot-Extended) [NC]
  RewriteCond %{REQUEST_URI} ^/(af|sq|am|ar|hy|az|eu|be|bn|bs|bg|ca|ceb|ny|zh-CN|zh-TW|co|hr|cs|da|nl|en|eo|et|tl|fi|fr|fy|gl|ka|de|el|gu|ht|ha|haw|iw|hi|hmn|hu|is|ig|id|ga|it|ja|jw|kn|kk|km|ko|ku|ky|lo|la|lv|lt|lb|mk|mg|ms|ml|mt|mi|mr|mn|my|ne|no|ps|fa|pl|pt|pa|ro|ru|sm|gd|sr|st|sn|sd|si|sk|sl|so|es|su|sw|sv|tg|ta|te|th|tr|uk|ur|uz|vi|cy|xh|yi|yo|zu)(/|$)
  RewriteRule ^ - [R=429,L]
  # Faceted-filter crawl shield (2026-11-05): scrapers walk every combination of ?filter_pa_*=a,b,c,... on
  # brand/category archives; each URL is uncacheable and runs a heavy layered-nav query. Shoppers pick one or two
  # values, so 3+ values in one filter get 429 + Retry-After.
  RewriteCond %{QUERY_STRING} (^|&)filter_pa_[a-z0-9_-]+=[^&,]+(,|%2C)[^&,]+(,|%2C)[^&]+ [NC]
  RewriteRule ^ - [R=429,L]
  Header always set Retry-After "3600" "expr=%{REQUEST_STATUS} == 429"

  # Missing FlyingPress cache file (2026-11-06): FlyingPress tells Cloudflare to keep /wp-content/cache/flying-press/
  # for a year, so the Rank Math 404-to-home 301 for a missing file stuck at the edge for 46 h after the cutover and
  # left pages unstyled. Answer 503 instead: Cloudflare does not cache it, so the file heals once FlyingPress rewrites it.
  RewriteCond %{REQUEST_URI} ^/wp-content/cache/flying-press/
  RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
  RewriteRule ^ - [R=503,L]

  # Broken srcset scrapers (2026-11-13): one bot requested "image-300x300.jpg 300w, https:/..." paths ~3,000 times in an
  # hour; each fell through to WordPress (Rank Math 404-to-home 301) and pushed load to 5. Apache answers 404 directly.
  RewriteCond %{THE_REQUEST} \s/wp-content/uploads/\S*\.(jpe?g|png|gif|webp)%20[0-9]+w [NC]
  RewriteRule ^ - [R=404,L]
  ErrorLog ${APACHE_LOG_DIR}/proskatersplace-error.log
  CustomLog ${APACHE_LOG_DIR}/proskatersplace-access.log combined
</VirtualHost>
