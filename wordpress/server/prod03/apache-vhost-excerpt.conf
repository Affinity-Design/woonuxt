  </Directory>
  <Files xmlrpc.php>
    Require all denied
  </Files>
  # Old /bitnami/wordpress/ URLs keep working
  RewriteEngine On
  RewriteRule ^/bitnami/wordpress(/.*)$ $1 [L,R=301]
  # TEMP 2026-11-05: block FlyingPress self-preload (it retried failing Cloud Optimizer pages in a loop and pinned the CPU).
  # Remove once FlyingPress support resolves its Cloud Optimizer HTTP 500s (TargetCloseError).
  RewriteCond %{REQUEST_URI} ^/wp-json/flying-press/ [OR]
  RewriteCond %{HTTP:X-Flying-Press-Preload}::%{REMOTE_ADDR} ^.+::(?!127.0.0.1$) [OR]
  RewriteCond %{HTTP_USER_AGENT} (FlyingPress) [NC]
  RewriteRule ^ - [R=503,L]
  Header always set Retry-After "3600" "expr=%{REQUEST_STATUS} == 503"
  ErrorLog ${APACHE_LOG_DIR}/proskatersplace-error.log
  CustomLog ${APACHE_LOG_DIR}/proskatersplace-access.log combined
</VirtualHost>
