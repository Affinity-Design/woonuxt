# Warm the Cloudflare KV route cache after every successful production deploy.
#
# Why this exists: Cloudflare Pages never runs `npm run postdeploy`, and the
# route cache (NUXT_CACHE) can only be filled through the live Worker — so
# warming was a manual step after every deploy. Since the per-deployment cache
# integrity fix (9bd8a92), every deploy also starts with an intentionally empty
# route cache, which means ~1,700 non-prerendered product pages render cold on
# their first visit until warmed.
#
# Triggers, in order of how deploys are actually detected:
#
# - check_run: Cloudflare Pages' GitHub App reports each build as a check run
#   named "Cloudflare Pages: <project>". This is the only signal it sends here —
#   verified 2026-08-04, when a successful prod deploy produced zero
#   deployment_status events. Actions' own job check runs cannot re-trigger
#   this workflow (GitHub suppresses workflow events generated by Actions), and
#   non-Cloudflare check runs are filtered in the job condition.
# - schedule: guaranteed fallback every 30 minutes in case the event path ever
#   breaks. The freshness probe makes quiet ticks a ~10s no-op.
# - deployment_status: kept in case Cloudflare's integration starts emitting
#   GitHub deployments.
# - workflow_dispatch: manual warm with a tunable delay; bypasses the
#   already-warmed check.
#
# Any trigger may fire late, repeatedly, or for the wrong Pages project
# (testdev/dev build from this repo too), so events are never trusted directly.
# Two gates decide whether to actually warm:
#
# 1. Freshness — https://proskatersplace.ca/_nuxt/builds/latest.json must be
#    serving a build younger than MAX_BUILD_AGE_MINUTES. Events for the other
#    projects find a stale production timestamp and skip.
# 2. Dedupe — the live build id is cached (actions/cache) once warmed, so the
#    scheduled fallback and repeat events don't re-crawl a build that a
#    check_run-triggered run already warmed. The marker is only saved when the
#    warm completes, so a failed run is retried by the next trigger.
#
# Requires: repository secret REVALIDATION_SECRET (same value as the
# Cloudflare Pages env var) — the warmer authenticates to
# /api/internal/script-storage with it to load the product/category lists.
name: Warm cache after production deploy

run-name: Warm cache (${{ github.event_name }})

on:
  check_run:
    types: [completed]
  deployment_status:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      request_delay_ms:
        description: 'Delay between warmed URLs (ms)'
        required: false
        default: '1000'

permissions:
  contents: read

# Never kill an in-flight warm; a queued run will hit the dedupe marker and
# skip, and a genuinely new deploy warms right after the old run finishes.
concurrency:
  group: warm-cache-production
  cancel-in-progress: false

env:
  SITE_URL: https://proskatersplace.ca
  # A prod build writes latest.json at build start and promotes ~20 min later;
  # anything older than this did not just deploy.
  MAX_BUILD_AGE_MINUTES: 120

jobs:
  warm:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success') ||
      (github.event_name == 'check_run' &&
       github.event.check_run.conclusion == 'success' &&
       startsWith(github.event.check_run.name, 'Cloudflare Pages'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check the live site is serving a fresh build
        id: freshness
        run: |
          # Cache-bust: /_nuxt/*.json was long served immutable by public/_headers.
          latest=$(curl -fsS "$SITE_URL/_nuxt/builds/latest.json?warm=$(date +%s)") || latest=""
          build_id=$(echo "$latest" | jq -r '.id // empty' 2>/dev/null || true)
          ts_ms=$(echo "$latest" | jq -r '.timestamp // empty' 2>/dev/null || true)
          echo "build_id=${build_id:-unknown-$(date +%Y%m%d%H%M)}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — skipping freshness gate."
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$ts_ms" ]; then
            echo "::error::Could not read a build timestamp from $SITE_URL/_nuxt/builds/latest.json (got: $latest)"
            exit 1
          fi
          age_min=$(( ( $(date +%s) - ts_ms / 1000 ) / 60 ))
          echo "Live build $build_id is ${age_min} minutes old (max ${MAX_BUILD_AGE_MINUTES})."
          if [ "$age_min" -le "$MAX_BUILD_AGE_MINUTES" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Production build unchanged — nothing to warm."
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if this build was already warmed
        id: dedupe
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/cache@v4
        with:
          path: .warm-marker
          key: warmed-${{ steps.freshness.outputs.build_id }}

      - name: Decide whether to warm
        id: decide
        if: steps.freshness.outputs.fresh == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.dedupe.outputs.cache-hit }}" = "true" ]; then
            echo "::notice::Build ${{ steps.freshness.outputs.build_id }} was already warmed by an earlier run."
            echo "warm=false" >> "$GITHUB_OUTPUT"
          else
            echo "warm=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require REVALIDATION_SECRET
        if: steps.decide.outputs.warm == 'true'
        env:
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          if [ -z "$REVALIDATION_SECRET" ]; then
            echo "::error::Repository secret REVALIDATION_SECRET is not set. The warmer cannot load the product list without it (it would silently warm nothing)."
            exit 1
          fi

      - name: Checkout
        if: steps.decide.outputs.warm == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.decide.outputs.warm == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Deliberately NOT `npm ci`: postinstall runs `nuxt prepare`, which needs
      # live GraphQL schema introspection — the warmer only needs these two.
      - name: Install warmer dependencies
        if: steps.decide.outputs.warm == 'true'
        run: npm install --no-save --ignore-scripts node-fetch@2.7.0 dotenv

      - name: Warm caches slowly
        if: steps.decide.outputs.warm == 'true'
        env:
          FRONTEND_URL: ${{ env.SITE_URL }}
          NUXT_APP_URL: ${{ env.SITE_URL }}
          REQUEST_DELAY: ${{ github.event.inputs.request_delay_ms || '1000' }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: node scripts/cache-warmer.js all

      # The cache action's post step persists .warm-marker under the key
      # warmed-<build_id> only if the job succeeds, which is exactly the
      # at-most-once semantics the dedupe gate needs.
      - name: Record this build as warmed
        if: steps.decide.outputs.warm == 'true'
        run: |
          mkdir -p .warm-marker
          echo "${{ steps.freshness.outputs.build_id }} $(date -u +%FT%TZ)" > .warm-marker/warmed
